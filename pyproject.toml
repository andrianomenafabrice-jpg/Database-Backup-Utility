[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbbackup"
version = "0.1.0"
description = "CLI multi-SGBD pour sauvegarder et restaurer des bases de données"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
gcs = ["google-cloud-storage>=2.10"]
azure = ["azure-storage-blob>=12.19"]
cloud = ["boto3>=1.28", "google-cloud-storage>=2.10", "azure-storage-blob>=12.19"]
dev = ["pytest>=7.0"]

[project.scripts]
dbbackup = "dbbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
